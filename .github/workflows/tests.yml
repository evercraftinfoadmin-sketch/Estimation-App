name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Base44 app for this branch, no secrets
        run: node check-config.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (no Base44 access)
        run: npm test
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-output
          path: tests/output
