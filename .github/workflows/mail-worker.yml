# Deploys the CRM mail service (worker/) to Cloudflare from main.
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  - required to deploy
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, MAIL_SETUP_KEY - copied into the Worker as secrets when set
# Setup steps: docs/EMAIL_SENDING.md
name: Deploy mail service

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/mail-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mail-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Mail service tests
        working-directory: tests
        run: node suites/mailworker.test.js
      - name: Cloudflare secrets present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see docs/EMAIL_SENDING.md), then run this workflow again."
            exit 1
          fi
      - name: Install wrangler
        run: npm install --global wrangler@4.146.0
      - name: Deploy
        working-directory: worker
        run: wrangler deploy
      - name: Copy Google settings into the Worker
        working-directory: worker
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MAIL_SETUP_KEY: ${{ secrets.MAIL_SETUP_KEY }}
        run: |
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET MAIL_SETUP_KEY; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | wrangler secret put "$name"
            else
              echo "::warning::$name is not set yet; Gmail cannot be connected until it is (see docs/EMAIL_SENDING.md)."
            fi
          done
