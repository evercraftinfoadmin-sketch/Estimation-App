# EverCraft CRM mail service. Deployed from GitHub by .github/workflows/mail-worker.yml.
# Secrets (set by the workflow from GitHub secrets, never in this file):
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, MAIL_SETUP_KEY
name = "evercraft-mail"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[kv_namespaces]]
binding = "MAIL_KV"
id = "db2d6ee842034033b67be5988a078729"

[vars]
ALLOWED_SENDER = "EverCraft.pro@gmail.com"
SENDER_NAME = "EverCraft Home Improvement"
# The CRM's web addresses (production on GitHub Pages, dev and the old address on raw.githack.com).
ALLOWED_ORIGINS = "https://evercraftinfoadmin-sketch.github.io,https://raw.githack.com"
# Base44 apps whose signed-in team members may send: app id -> API address.
BASE44_APPS = '{"6aceadfed0aa786c7c2934ff":"https://base44.app","6acd6d429d6ed1576d7696b7":"https://preview--ever-craft-crm-dev-6d7696b7.base44.app"}'
DAILY_LIMIT = "300"
